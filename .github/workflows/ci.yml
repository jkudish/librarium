name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auto-fix formatting
        run: npx biome check --write src/ tests/ benchmark/

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: auto-fix formatting [skip ci]"
          git push

  test:
    runs-on: ${{ matrix.os }}
    needs: [autoformat]
    if: always() && (needs.autoformat.result == 'success' || needs.autoformat.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — full suite
          - os: ubuntu-latest
            node-version: 20
            run-integration: true
          - os: ubuntu-latest
            node-version: 22
            run-integration: true
          - os: ubuntu-latest
            node-version: 24
            run-integration: true
          # Windows — unit tests only
          - os: windows-latest
            node-version: 20
            run-integration: false
          - os: windows-latest
            node-version: 22
            run-integration: false
          - os: windows-latest
            node-version: 24
            run-integration: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Offline benchmark fixture replay
        if: matrix.run-integration
        run: npm run benchmark:ci

      - name: Workers compatibility tests
        if: matrix.run-integration
        run: npm run test:workers

      - name: Integration tests
        if: matrix.run-integration
        run: npm run test:integration

  pty:
    # Interactive PTY smoke tests (live table, wizard, browse/pager, Ctrl+C).
    # Runs the real terminal flows against the built CLI on POSIX runners only;
    # the suite self-skips on Windows. Single Node version (22) keeps the matrix
    # small — these exercise terminal behaviour, not Node version compatibility.
    runs-on: ${{ matrix.os }}
    needs: [autoformat]
    if: always() && (needs.autoformat.result == 'success' || needs.autoformat.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PTY smoke tests
        # `test:pty` builds the CLI first, then runs the PTY suite.
        # NOTE: if these prove flaky on CI runners (PTY timing under load),
        # set `continue-on-error: true` here so a flake never blocks merges
        # while still surfacing in the checks list. Kept required for now —
        # the suite was flake-free across local runs.
        run: npm run test:pty
